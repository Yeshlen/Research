# Synthetic cardless withdrawal simulator: all tunable parameters.
# Every value here is either sourced (see `source:` comments) or a stated assumption.
# Regenerating with the same seed and config gives an identical dataset.

seed: 42
n_customers: 20000
start_date: "2025-07-01"
days: 180                      # observation window (6 paydays + December festive period)
warmup_days: 30                # no scam episodes injected before this day
train_days: 120                # vouchers created before this day form the training split

product:                       # generic South African cardless voucher product
  default_daily_limit: 2500    # source: Nedbank cardless withdrawal FAQ (default R2 500)
  max_daily_limit: 5000        # source: Standard Bank Instant Money T&Cs cl. 6.1; Absa CashSend; Nedbank FAQ
  monthly_limit: 25000         # source: Standard Bank Instant Money T&Cs cl. 6.1; Absa CashSend
  amount_step: 50              # source: Absa CashSend (R50 increments)
  p_round_100: 0.6             # assumption: people prefer round hundreds
  voucher_expiry_days: 30      # source: Absa CashSend, Nedbank FAQ
  p_start_raised_limit: 0.12   # assumption: share of customers who already raised their limit before the window
  p_raise_on_demand: 0.6       # assumption: a legit customer whose voucher exceeds the limit raises it in-session

# share, median vouchers per month, median voucher amount (R), mean background app sessions per month
segments:
  student:   {share: 0.20, rate: 0.5, amount: 300, sessions: 10}
  salaried:  {share: 0.45, rate: 0.8, amount: 800, sessions: 14}
  informal:  {share: 0.20, rate: 1.2, amount: 600, sessions: 8}
  pensioner: {share: 0.15, rate: 0.4, amount: 500, sessions: 5}

behaviour:
  rate_sigma: 1.0              # log-normal spread of activity between customers -> long tail
  max_monthly_rate: 20
  amount_sigma: 0.5            # spread of typical amount between customers
  within_amount_sigma: 0.35    # spread of one customer's amounts around their typical amount
  payday_boost: 2.0            # source: SA payday cycle (25th to 1st); multiplier on voucher rate
  weekend_boost: 1.3
  december_boost: 1.5
  pref_hour_mean: 13
  pref_hour_sd: 3
  hour_sd_within: 2
  mean_extra_recipients: 1.5   # recipients = 1 + Poisson(this)
  p_known_beta: [8, 2]         # Beta prior for P(send to an existing recipient)
  p_self_send_beta: [1, 6]     # Beta prior for P(customer sends voucher to self)
  p_recipient_other_city: 0.2  # recipient lives in another metro (family elsewhere)
  p_late_joiner: 0.15          # account opened during the window
  bg_sessions_scale: 0.3       # background sessions = segment sessions * this (keeps log size manageable)
  p_device_change_per_month: 0.03
  p_password_reset_per_month: 0.02
  p_legit_limit_raise_per_month: 0.03

session:                       # seconds from login to voucher creation
  habitual_median_s: 70        # experienced users are fast
  novice_median_s: 200
  sigma: 0.6
  screens_mean: 3
  p_browse: 0.12               # legit sessions where the customer browses first (balance, statements): many screens
  browse_screens_mean: 7
  p_multi_voucher: 0.05        # legit sessions sending to two recipients (e.g. payday: parent and sibling)

redemption:                    # legitimate voucher redemption delay (minutes)
  legit_median_min: 180
  legit_sigma: 1.3
  p_legit_fast: 0.12           # recipient waiting at ATM: 3-25 min
  p_never_redeemed: 0.03       # voucher expires unredeemed
  p_atm: 0.7                   # rest redeemed at retailers

legit_episodes:                # per-customer probability over the window
  emergency: 0.04              # urgent large send, often after a limit raise
  new_phone: 0.08              # device change then normal use
  travel: 0.04                 # voucher redeemed in another city

scam:
  p_targeted: 0.11             # assumption: oversampled vs reality so that ~1-2% of vouchers are scams
  type_weights:
    scam_classic: 0.30
    scam_self_send: 0.20       # source: Standard Bank scam warning (victim told to send voucher to self)
    scam_limit_raise: 0.20     # assumption based on the limit-raise step described in bank warnings
    scam_split: 0.15
    scam_subtle: 0.15
  p_coached: 0.45              # scammer talks victim through the app: slow session, many screens
  rushed_median_s: 80
  coached_median_s: 540
  fast_redeem_median_min: 10
  fast_redeem_sigma: 0.6
  slow_redeem_median_min: 60
  p_far_redeem: 0.5            # fraudster cash-out point in another metro
  p_night: 0.08
  p_device_change: 0.05        # vishing victims normally use their own phone
  flags:                       # P(red flag) per scam type; no type fires every flag
    scam_classic:     {new_recipient: 0.90, high_amount: 0.80, limit_raise: 0.30, fast_redeem: 0.85}
    scam_self_send:   {new_recipient: 0.00, high_amount: 0.70, limit_raise: 0.30, fast_redeem: 0.85}
    scam_limit_raise: {new_recipient: 0.80, high_amount: 0.90, limit_raise: 1.00, fast_redeem: 0.80}
    scam_split:       {new_recipient: 0.85, high_amount: 0.00, limit_raise: 0.50, fast_redeem: 0.80}
    scam_subtle:      {new_recipient: 0.50, high_amount: 0.00, limit_raise: 0.00, fast_redeem: 0.40}

metros:                        # lat, lon, population weight (approximate metro populations)
  Johannesburg: [-26.20, 28.05, 0.28]
  Cape Town:    [-33.92, 18.42, 0.19]
  eThekwini:    [-29.86, 31.02, 0.16]
  Tshwane:      [-25.75, 28.19, 0.13]
  Ekurhuleni:   [-26.15, 28.35, 0.10]
  Nelson Mandela Bay: [-33.96, 25.60, 0.05]
  Mangaung:     [-29.12, 26.21, 0.04]
  Buffalo City: [-32.98, 27.87, 0.03]
  Polokwane:    [-23.90, 29.45, 0.02]
